name: Uptime Check

# Watches every public IHS and IAO hostname. A failed run is the alert:
# GitHub emails the person who last edited this schedule.
#
# Added 2026-10-08 after irokosociety.org returned HTTP 526 for five days
# unnoticed. Cause and fix: Main-Vault session note "2026-10-08 Session Notes
# (IHS Site Outage, Origin Certificate Expiry)".
#
# Independent of the nightly catalog build: no checkout, no secrets, read-only.

on:
  schedule:
    # Every 30 minutes, off the top of the hour to avoid the busiest cron slot.
    - cron: '7,37 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

concurrency:
  group: uptime-check
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check HTTP status and certificate lifetime
        run: |
          hosts="irokosociety.org www.irokosociety.org ontology.irokosociety.org medjat.irokosociety.org ileanaolofi.org www.ileanaolofi.org"
          min_cert_days=14
          failed=0

          http_check() {
            local host="$1" code="" i
            for i in 1 2 3; do
              code=$(curl -sS -o /dev/null -L -m 30 -A "IHS-uptime-check (GitHub Actions)" -w '%{http_code}' "https://$host/" 2>/dev/null) || true
              if [ "$code" = "200" ]; then
                echo "OK    HTTP $code  $host"
                return 0
              fi
              sleep 20
            done
            echo "FAIL  HTTP ${code:-none}  $host"
            return 1
          }

          cert_check() {
            local host="$1" end days
            end=$(echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then
              echo "FAIL  no certificate returned  $host"
              return 1
            fi
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            if [ "$days" -lt "$min_cert_days" ]; then
              echo "FAIL  certificate expires in $days days  $host"
              return 1
            fi
            echo "OK    certificate valid $days more days  $host"
          }

          for host in $hosts; do
            http_check "$host" || failed=1
            cert_check "$host" || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more checks failed." >&2
            exit 1
          fi
          echo "All hosts healthy."
